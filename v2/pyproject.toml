[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mahoi-wm-v2"
version = "0.1.0"
description = "MAHOI World Model + Planner (v2 skeleton)"
requires-python = ">=3.10"
# 코어는 numpy 하나에만 기댄다.  torch/matplotlib 는 선택 트랙이라
# 여기 넣지 않는다 (learn/, viz/ 가 채워질 때 optional-dependencies 로).
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["config", "safety", "planning", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: 5종 시나리오를 실제로 돌리는 회귀 테스트 (약 2분). --runslow 로만 실행된다",
]
