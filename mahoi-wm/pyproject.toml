[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mahoi-wm"
version = "0.1.0"
description = "World Model + Planner for multi-agent HOI trajectory coordination"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "pillow>=9.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["mahoi*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: 5종 시나리오를 실제로 돌리는 회귀 테스트 (약 10분). --runslow 로만 실행된다",
]
